<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc nghiệm Buổi 3: Học sâu (Deep Learning) và Mạng Nơ-ron</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #15803d;
            --primary-hover: #166534;
            --primary-light: #dcfce7;
            --accent: #22c55e;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #16a34a;
            --success-bg: #f0fdf4;
            --success-border: #bbf7d0;
            --error: #dc2626;
            --error-bg: #fef2f2;
            --error-border: #fecaca;
            --radius: 12px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 24px 16px;
        }

        .quiz-wrapper {
            width: 100%;
            max-width: 840px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        /* Header Bar */
        .quiz-header {
            padding: 20px 28px;
            background: linear-gradient(135deg, #14532d 0%, #166534 100%);
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .quiz-header h1 {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .session-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            backdrop-filter: blur(4px);
        }

        .quiz-meta {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-palette {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-palette:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* Progress Bar */
        .progress-track {
            width: 100%;
            height: 6px;
            background-color: #e2e8f0;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #16a34a);
            width: 0%;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Quiz Body */
        .quiz-body {
            padding: 32px 28px;
        }

        .question-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .counter-badge {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary);
        }

        .tags-cluster {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .tag-pill {
            font-size: 0.78rem;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
            background: #f1f5f9;
            color: var(--text-muted);
        }

        .tag-pill.diff-de { background: #dcfce7; color: #166534; }
        .tag-pill.diff-tb { background: #fef3c7; color: #92400e; }
        .tag-pill.diff-kho { background: #fee2e2; color: #991b1b; }

        .question-title {
            font-size: 1.22rem;
            font-weight: 700;
            line-height: 1.55;
            color: var(--text-main);
            margin-bottom: 24px;
        }

        /* Options Grid */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-card {
            display: flex;
            align-items: flex-start;
            padding: 14px 18px;
            border: 2px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #ffffff;
            user-select: none;
        }

        .option-card:hover:not(.locked) {
            border-color: var(--accent);
            background: #f8fafc;
            transform: translateY(-1px);
        }

        .option-card.selected:not(.locked) {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .option-card.locked {
            cursor: default;
        }

        .option-card.is-correct {
            border-color: var(--success) !important;
            background-color: var(--success-bg) !important;
        }

        .option-card.is-wrong {
            border-color: var(--error) !important;
            background-color: var(--error-bg) !important;
        }

        .option-letter {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: #f1f5f9;
            color: var(--text-main);
            font-weight: 700;
            font-size: 0.95rem;
            margin-right: 14px;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .option-card.selected .option-letter {
            background: var(--primary);
            color: #ffffff;
        }

        .option-card.is-correct .option-letter {
            background: var(--success);
            color: #ffffff;
        }

        .option-card.is-wrong .option-letter {
            background: var(--error);
            color: #ffffff;
        }

        .option-text {
            font-size: 1.02rem;
            line-height: 1.5;
            color: var(--text-main);
            padding-top: 3px;
        }

        /* Feedback Box */
        .feedback-box {
            display: none;
            padding: 18px 20px;
            border-radius: 10px;
            margin-bottom: 24px;
            animation: slideDown 0.3s ease;
        }

        .feedback-box.show {
            display: block;
        }

        .feedback-box.correct {
            background-color: var(--success-bg);
            border: 1px solid var(--success-border);
        }

        .feedback-box.incorrect {
            background-color: var(--error-bg);
            border: 1px solid var(--error-border);
        }

        .feedback-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .correct .feedback-title { color: var(--success); }
        .incorrect .feedback-title { color: var(--error); }

        .feedback-desc {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #334155;
        }

        /* Action Buttons */
        .actions-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .btn {
            padding: 12px 26px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .btn-secondary {
            background: #f1f5f9;
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        /* Result Screen */
        .result-screen {
            display: none;
            text-align: center;
            padding: 40px 24px;
        }

        .score-ring-wrap {
            position: relative;
            width: 170px;
            height: 170px;
            margin: 0 auto 28px;
        }

        .score-circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(var(--accent) 0%, #e2e8f0 0%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }

        .score-inner {
            width: 136px;
            height: 136px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .score-number {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
        }

        .score-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 600;
        }

        .result-title {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        .result-summary {
            font-size: 1.05rem;
            color: var(--text-muted);
            max-width: 500px;
            margin: 0 auto 32px;
            line-height: 1.6;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            max-width: 500px;
            margin: 0 auto 36px;
        }

        .stat-card {
            padding: 16px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        .stat-val {
            font-size: 1.4rem;
            font-weight: 800;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 500;
        }

        /* Palette Drawer */
        .drawer-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 100;
        }

        .drawer {
            position: fixed;
            top: 0;
            right: -360px;
            width: 340px;
            height: 100%;
            background: #ffffff;
            box-shadow: -4px 0 20px rgba(0,0,0,0.15);
            z-index: 101;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            padding: 24px;
        }

        .drawer.open {
            right: 0;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .drawer-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            overflow-y: auto;
            flex: 1;
            padding-right: 4px;
        }

        .palette-item {
            height: 42px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        .palette-item:hover {
            border-color: var(--primary);
            background: #e2e8f0;
        }

        .palette-item.active {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary);
        }

        .palette-item.correct {
            background: var(--success);
            color: #ffffff;
            border-color: var(--success);
        }

        .palette-item.wrong {
            background: var(--error);
            color: #ffffff;
            border-color: var(--error);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 640px) {
            body { padding: 10px; }
            .quiz-body { padding: 20px 16px; }
            .quiz-header { padding: 16px; }
            .stats-grid { grid-template-columns: 1fr; gap: 8px; }
        }
    </style>
</head>
<body>

<div class="quiz-wrapper">
    <!-- Header -->
    <div class="quiz-header">
        <h1>
            <span>🌾</span>
            <span>Buổi 3: Học sâu (Deep Learning) và Mạng Nơ-ron</span>
        </h1>
        <div class="quiz-meta">
            <span class="session-badge">Buổi 3</span>
            <button class="btn-palette" onclick="toggleDrawer()">📋 Mục lục câu</button>
        </div>
    </div>

    <!-- Progress Track -->
    <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
    </div>

    <!-- Screen 1: Quiz Active -->
    <div class="quiz-body" id="quiz-screen">
        <div class="question-meta-row">
            <div class="counter-badge" id="question-counter">Câu hỏi 1 / 40</div>
            <div class="tags-cluster">
                <span class="tag-pill" id="section-tag">Tổng quan</span>
                <span class="tag-pill" id="difficulty-tag">Dễ</span>
            </div>
        </div>

        <h2 class="question-title" id="question-text">Đang tải câu hỏi...</h2>

        <div class="options-list" id="options-container">
            <!-- Dynamic Options -->
        </div>

        <!-- Feedback Container -->
        <div class="feedback-box" id="feedback-box">
            <div class="feedback-title" id="feedback-title"></div>
            <div class="feedback-desc" id="feedback-desc"></div>
        </div>

        <!-- Actions -->
        <div class="actions-row">
            <button class="btn btn-secondary" id="btn-prev" onclick="navigatePrev()">← Câu trước</button>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-primary" id="btn-check" onclick="checkAnswer()" disabled>Kiểm tra</button>
                <button class="btn btn-primary" id="btn-next" onclick="navigateNext()" style="display: none;">Câu tiếp theo →</button>
            </div>
        </div>
    </div>

    <!-- Screen 2: Results -->
    <div class="result-screen" id="result-screen">
        <div class="score-ring-wrap">
            <div class="score-circle" id="score-circle">
                <div class="score-inner">
                    <span class="score-number" id="final-score">0</span>
                    <span class="score-label" id="final-total">/ 40</span>
                </div>
            </div>
        </div>

        <h2 class="result-title" id="result-title">Chúc mừng bạn đã hoàn thành!</h2>
        <p class="result-summary" id="result-summary">Bạn đã trả lời xuất sắc hầu hết các câu hỏi trong phần này.</p>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-val" style="color: var(--success);" id="stat-correct">0</div>
                <div class="stat-label">Số câu đúng</div>
            </div>
            <div class="stat-card">
                <div class="stat-val" style="color: var(--error);" id="stat-wrong">0</div>
                <div class="stat-label">Số câu sai</div>
            </div>
            <div class="stat-card">
                <div class="stat-val" style="color: var(--primary);" id="stat-accuracy">0%</div>
                <div class="stat-label">Độ chính xác</div>
            </div>
        </div>

        <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
            <button class="btn btn-primary" onclick="restartQuiz()">🔄 Làm lại bài</button>
            <button class="btn btn-secondary" onclick="viewAllAnswers()">🔍 Xem lại chi tiết đáp án</button>
        </div>
    </div>
</div>

<!-- Drawer / Question Palette -->
<div class="drawer-overlay" id="drawer-overlay" onclick="toggleDrawer()"></div>
<div class="drawer" id="drawer">
    <div class="drawer-header">
        <h3 style="font-size: 1.1rem; font-weight: 700;">Danh sách câu hỏi</h3>
        <button class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.85rem;" onclick="toggleDrawer()">Đóng ✕</button>
    </div>
    <div class="drawer-grid" id="palette-grid">
        <!-- Palette numbers -->
    </div>
</div>

ficulty_code": "NB", "question": "Thuật toán huấn luyện phổ biến nhất giúp tính toán gradient của lỗi và cập nhật trọng số trong mạng nơ-ron đa lớp được gọi là gì?", "options": [{"id": "A", "text": "K-Means Clustering."}, {"id": "B", "text": "Lan truyền ngược (Backpropagation)."}, {"id": "C", "text": "Decision Tree Learning."}, {"id": "D", "text": "Naive Bayes."}], "answer": "B", "explanation": "Thuật toán huấn luyện phổ biến nhất cho mạng nơ-ron là lan truyền ngược (backpropagation), được giới thiệu bởi Rumelhart và cộng sự năm 1986."}, {"id": 87, "local_id": 8, "section": "PHẦN 1: NỀN TẢNG MẠNG NƠ-RON NHÂN TẠO (ANN)", "difficulty": "Dễ", "difficulty_code": "NB", "question": "Vai trò chính của “Hàm kích hoạt” (Activation Function) phi tuyến tính (như ReLU, Sigmoid) trong mạng nơ-ron là gì?", "options": [{"id": "A", "text": "Để làm cho mạng nơ-ron trông phức tạp hơn."}, {"id": "B", "text": "Để giúp mạng nơ-ron có thể học và xấp xỉ các hàm phi tuyến tính phức tạp (nếu không có nó, mạng chỉ là hàm tuyến tính)."}, {"id": "C", "text": "Để tăng tốc độ tính toán của máy tính."}, {"id": "D", "text": "Để loại bỏ các giá trị âm."}], "answer": "B", "explanation": "Sự phi tuyến tính được đưa vào bởi các hàm kích hoạt là yếu tố then chốt, cho phép MLP xấp xỉ bất kỳ hàm liên tục nào. Nếu không có hàm kích hoạt phi tuyến, mạng sâu bao nhiêu cũng chỉ tương đương một mô hình tuyến tính đơn giản ."}, {"id": 88, "local_id": 9, "section": "PHẦN 1: NỀN TẢNG MẠNG NƠ-RON NHÂN TẠO (ANN)", "difficulty": "Dễ", "difficulty_code": "NB", "question": "Trong quá trình huấn luyện mạng nơ-ron, thuật toán “Gradient Descent” được sử dụng để làm gì?", "options": [{"id": "A", "text": "Tăng lỗi dự đoán lên mức cao nhất."}, {"id": "B", "text": "Tìm giá trị trọng số tối ưu để giảm thiểu hàm mất mát (loss function)."}, {"id": "C", "text": "Tạo ra thêm dữ liệu huấn luyện."}, {"id": "D", "text": "Vẽ biểu đồ cấu trúc mạng."}], "answer": "B", "explanation": "Backpropagation tính toán gradient của hàm mất mát đối với từng tham số và sau đó cập nhật các tham số này thông qua thuật toán Gradient Descent để giảm thiểu lỗi ."}, {"id": 89, "local_id": 10, "section": "PHẦN 1: NỀN TẢNG MẠNG NƠ-RON NHÂN TẠO (ANN)", "difficulty": "Dễ", "difficulty_code": "NB", "question": "“Học sâu” (Deep Learning) khác biệt so với mạng nơ-ron truyền thống chủ yếu ở điểm nào về mặt kiến trúc?", "options": [{"id": "A", "text": "Nó sử dụng ít nơ-ron hơn."}, {"id": "B", "text": "Nó có rất nhiều lớp ẩn (deep stack of layers) để trích xuất các đặc trưng ở mức độ trừu tượng cao dần."}, {"id": "C", "text": "Nó không sử dụng máy tính."}, {"id": "D", "text": "Nó chỉ giải quyết được các bài toán toán học đơn giản."}], "answer": "B", "explanation": "Deep Learning đề cập đến các mạng nơ-ron có cấu trúc sâu (nhiều lớp xếp chồng), cho phép học các biểu diễn dữ liệu ở nhiều mức độ trừu tượng ."}, {"id": 90, "local_id": 11, "section": "PHẦN 1: NỀN TẢNG MẠNG NƠ-RON NHÂN TẠO (ANN)", "difficulty": "Dễ", "difficulty_code": "NB", "question": "Bước “Forward Pass” (Lan truyền xuôi) trong thuật toán Backpropagation thực hiện nhiệm vụ gì?", "options": [{"id": "A", "text": "Tính toán lỗi và đi ngược lại để sửa trọng số."}, {"id": "B", "text": "Đưa dữ liệu đầu vào qua các lớp để tính toán đầu ra dự đoán."}, {"id": "C", "text": "Xóa sạch trọng số của mạng."}, {"id": "D", "text": "Cập nhật nhãn của dữ liệu."}], "answer": "B", "explanation": "Trong bước forward pass, thuật toán đưa dữ liệu qua mạng từ đầu vào đến đầu ra để tính toán dự đoán và đo lường lỗi ."}, {"id": 91, "local_id": 12, "section": "PHẦN 1: NỀN TẢNG MẠNG NƠ-RON NHÂN TẠO (ANN)", "difficulty": "Dễ", "difficulty_code": "NB", "question": "Tại sao mạng nơ-ron cần quá trình “Huấn luyện” (Training)?", "options": [{"id": "A", "text": "Để máy tính nóng lên trước khi làm việc."}, {"id": "B", "text": "Để tìm ra bộ trọng số (Weights) và độ lệch (Bias) tốt nhất giúp giảm thiểu sai số giữa dự đoán và thực tế."}, {"id": "C", "text": "Để người lập trình có thời gian nghỉ ngơi."}, {"id": "D", "text": "Để cài đặt phần mềm vào máy."}], "answer": "B", "explanation": "Mục tiêu của huấn luyện là tìm kiếm các giá trị tham số của mô hình (trọng số và độ lệch) để tối ưu hóa thước đo hiệu suất (giảm thiểu lỗi) ."}, {"id": 92, "local_id": 13, "section": "PHẦN 2: HỌC SÂU (DEEP LEARNING) & MẠNG NƠ-RON TÍCH CHẬP (CNN)", "difficulty": "Trung bình", "difficulty_code": "TH", "question": "Sự khác biệt cơ bản nhất giữa “Học máy truyền thống” (Machine Learning) và “Học sâu” (Deep Learning) về khía cạnh trích xuất đặc trưng (Feature Extraction) là gì?", "options": [{"id": "A", "text": "Học máy tự động trích xuất đặc trưng; Học sâu cần con người làm thủ công."}, {"id": "B", "text": "Học máy cần chuyên gia trích xuất đặc trưng thủ công; Học sâu tự động học và trích xuất đặc trưng từ dữ liệu thô."}, {"id": "C", "text": "Cả hai đều cần con người làm thủ công."}, {"id": "D", "text": "Học sâu không cần đặc trưng nào cả."}], "answer": "B", "explanation": "Trong ML truyền thống, chuyên gia cần xác định và trích xuất đặc trưng thủ công. DL tự động học và trích xuất các đặc trưng từ dữ liệu thô ở nhiều cấp độ ."}, {"id": 93, "local_id": 14, "section": "PHẦN 2: HỌC SÂU (DEEP LEARNING) & MẠNG NƠ-RON TÍCH CHẬP (CNN)", "difficulty": "Trung bình", "difficulty_code": "TH", "question": "Tại sao Học sâu (Deep Learning) lại yêu cầu phần cứng mạnh mẽ (như GPU) hơn so với Học máy thông thường?", "options": [{"id": "A", "text": "Vì nó cần màn hình độ phân giải cao để hiển thị."}, {"id": "B", "text": "Vì nó thực hiện một lượng khổng lồ các phép tính ma trận trên hàng triệu tham số trong mạng nơ-ron nhiều lớp."}, {"id": "C", "text": "Vì nó cần kết nối Internet tốc độ cao liên tục."}, {"id": "D", "text": "Vì nó chiếm nhiều dung lượng ổ cứng hơn."}], "answer": "B", "explanation": "Học sâu yêu cầu máy móc cấu hình cao (đặc biệt là GPU) để hoạt động hiệu quả do khối lượng tính toán lớn của các mạng nơ-ron sâu."}, {"id": 94, "local_id": 15, "section": "PHẦN 2: HỌC SÂU (DEEP LEARNING) & MẠNG NƠ-RON TÍCH CHẬP (CNN)", "difficulty": "Trung bình", "difficulty_code": "TH", "question": "Kiến trúc mạng nơ-ron nào được coi là “khối xây dựng cốt lõi” cho các bài toán thị giác máy tính (như nhận diện ảnh bệnh cây trồng)?", "options": [{"id": "A", "text": "RNN (Recurrent Neural Network)."}, {"id": "B", "text": "CNN (Convolutional Neural Network - Mạng Nơ-ron Tích chập)."}, {"id": "C", "text": "K-Means Clustering."}, {"id": "D", "text": "Linear Regression."}], "answer": "B", "explanation": "Mạng Nơ-ron Tích chập (CNN) là khối xây dựng quan trọng nhất của các hệ thống thị giác máy tính hiện đại, thiết kế đặc biệt cho dữ liệu dạng lưới như hình ảnh ."}, {"id": 95, "local_id": 16, "section": "PHẦN 2: HỌC SÂU (DEEP LEARNING) & MẠNG NƠ-RON TÍCH CHẬP (CNN)", "difficulty": "Trung bình", "difficulty_code": "TH", "question": "Trong mạng CNN, nhiệm vụ chính của “Lớp Tích chập” (Convolutional Layer) là gì?", "options": [{"id": "A", "text": "Giảm kích thước ảnh ngay lập tức."}, {"id": "B", "text": "Sử dụng các bộ lọc (filters) để quét qua ảnh và phát hiện các đặc trưng cục bộ (cạnh, góc, màu sắc)."}, {"id": "C", "text": "Biến đổi ảnh thành văn bản."}, {"id": "D", "text": "Phân loại ảnh ra kết quả cuối cùng."}], "answer": "B", "explanation": "Mỗi nơ-ron trong lớp tích chập kết nối với các pixel trong trường tiếp nhận cục bộ. Các bộ lọc (filters) được sử dụng để phát hiện các đặc trưng cụ thể như cạnh, góc."}, {"id": 96, "local_id": 17, "section": "PHẦN 2: HỌC SÂU (DEEP LEARNING) & MẠNG NƠ-RON TÍCH CHẬP (CNN)", "difficulty": "Trung bình", "difficulty_code": "TH", "question": "“Bản đồ đặc trưng” (Feature Map) trong CNN được tạo ra như thế nào?", "options": [{"id": "A", "text": "Do người dùng vẽ tay."}, {"id": "B", "text": "Là kết quả đầu ra khi áp dụng một bộ lọc (filter) lên ảnh đầu vào."}, {"id": "C", "text": "Là bản đồ vị trí địa lý của bức ảnh."}, {"id": "D", "text": "Là danh sách các màu sắc trong ảnh."}], "answer": "B", "explanation": "Mỗi bộ lọc sẽ tạo ra một bản đồ đặc trưng, làm nổi bật các vùng trong ảnh kích hoạt mạnh mẽ bộ lọc đó."}, {"id": 97, "local_id": 18, "section": "PHẦN 2: HỌC SÂU (DEEP LEARNING) & MẠNG NƠ-RON TÍCH CHẬP (CNN)", "difficulty": "Trung bình", "difficulty_code": "TH", "question": "Mục tiêu chính của “Lớp Gộp” (Pooling Layer), ví dụ như Max Pooling, là gì?", "options": [{"id": "A", "text": "Tăng độ phân giải của ảnh lên gấp đôi."}, {"id": "B", "text": "Giảm kích thước không gian của bản đồ đặc trưng (lấy mẫu con) để giảm tải tính toán và hạn chế quá khớp (overfitting)."}, {"id": "C", "text": "Tô màu cho bức ảnh."}, {"id": "D", "text": "Xoay bức ảnh 90 độ."}], "answer": "B", "explanation": "Mục tiêu của lớp gộp là lấy mẫu con (subsample) hoặc thu nhỏ kích thước không gian để giảm tải tính toán, yêu cầu bộ nhớ và số lượng tham số ."}, {"id": 98, "local_id": 19, "section": "PHẦN 2: HỌC SÂU (DEEP LEARNING) & MẠNG NƠ-RON TÍCH CHẬP (CNN)", "difficulty": "Trung bình", "difficulty_code": "TH", "question": "Trong kỹ thuật tích chập, tham số “Stride” (Sải bước) có ý nghĩa gì?", "options": [{"id": "A", "text": "Là kích thước của bộ lọc."}, {"id": "B", "text": "Là khoảng cách dịch chuyển của bộ lọc trên ảnh đầu vào mỗi lần quét."}, {"id": "C", "text": "Là số lượng lớp ẩn."}, {"id": "D", "text": "Là độ sáng của ảnh."}], "answer": "B", "explanation": "Sải bước (strides) là khoảng cách dịch chuyển của bộ lọc trên ảnh đầu vào. Sải bước lớn hơn 1 sẽ làm giảm kích thước đầu ra ."}, {"id": 99, "local_id": 20, "section": "PHẦN 2: HỌC SÂU (DEEP LEARNING) & MẠNG NƠ-RON TÍCH CHẬP (CNN)", "difficulty": "Trung bình", "difficulty_code": "TH", "question": "Kỹ thuật “Padding” (Đệm) thường được sử dụng trong CNN để làm gì?", "options": [{"id": "A", "text": "Thêm các giá trị 0 xung quanh ảnh đầu vào để giữ nguyên kích thước ảnh sau khi tích chập."}, {"id": "B", "text": "Xóa bớt các pixel ở viền ảnh."}, {"id": "C", "text": "Làm mờ ảnh để bảo mật."}, {"id": "D", "text": "Tăng độ tương phản của ảnh."}], "answer": "A", "explanation": "Padding là việc thêm các giá trị 0 xung quanh ảnh đầu vào. ‘padding=“same”’ đảm bảo kích thước đầu ra bằng kích thước đầu vào."}, {"id": 100, "local_id": 21, "section": "PHẦN 2: HỌC SÂU (DEEP LEARNING) & MẠNG NƠ-RON TÍCH CHẬP (CNN)", "difficulty": "Trung bình", "difficulty_code": "TH", "question": "Lớp nào trong CNN có nhiệm vụ chuyển đổi dữ liệu 3D (từ các lớp tích chập/gộp) thành vector 1D để đưa vào mạng kết nối đầy đủ?", "options": [{"id": "A", "text": "Lớp Convolution."}, {"id": "B", "text": "Lớp Flatten (Làm phẳng)."}, {"id": "C", "text": "Lớp Pooling."}, {"id": "D", "text": "Lớp Softmax."}], "answer": "B", "explanation": "Lớp làm phẳng (Flatten) chuyển đổi đầu ra 3D từ các lớp tích chập thành một vector 1D để đưa vào mạng kết nối đầy đủ."}, {"id": 101, "local_id": 22, "section": "PHẦN 2: HỌC SÂU (DEEP LEARNING) & MẠNG NƠ-RON TÍCH CHẬP (CNN)", "difficulty": "Trung bình", "difficulty_code": "TH", "question": "Trong bài toán phân loại bệnh cây trồng, đầu ra của mạng CNN thường đi qua hàm nào để tính xác suất thuộc về từng loại bệnh (ví dụ: Bệnh phấn trắng, Bệnh gỉ sắt, Khỏe mạnh)?", "options": [{"id": "A", "text": "Hàm ReLU."}, {"id": "B", "text": "Hàm Softmax."}, {"id": "C", "text": "Hàm Linear."}, {"id": "D", "text": "Hàm Step."}], "answer": "B", "explanation": "Lớp đầu ra thường sử dụng một lớp softmax cho bài toán phân loại đa lớp để xuất ra dự đoán cuối cùng."}, {"id": 102, "local_id": 23, "section": "PHẦN 2: HỌC SÂU (DEEP LEARNING) & MẠNG NƠ-RON TÍCH CHẬP (CNN)", "difficulty": "Trung bình", "difficulty_code": "TH", "question": "VGG16, ResNet-50, InceptionV3 là tên gọi của cái gì?", "options": [{"id": "A", "text": "Các loại virus máy tính."}, {"id": "B", "text": "Các kiến trúc mạng CNN nổi tiếng đã được huấn luyện trước (Pre-trained models) thường dùng trong Học chuyển giao."}, {"id": "C", "text": "Tên các loại cảm biến IoT."}, {"id": "D", "text": "Tên các vệ tinh nông nghiệp."}], "answer": "B", "explanation": "Đây là các kiến trúc nổi tiếng. Tài liệu nhắc đến việc so sánh hiệu quả của VGG16, ResNet-50, InceptionV3 trong việc phân loại bệnh lá táo."}, {"id": 103, "local_id": 24, "section": "PHẦN 2: HỌC SÂU (DEEP LEARNING) & MẠNG NƠ-RON TÍCH CHẬP (CNN)", "difficulty": "Trung bình", "difficulty_code": "TH", "question": "“Học chuyển giao” (Transfer Learning) giúp ích gì cho bài toán nhận diện bệnh cây trồng khi chúng ta có ít dữ liệu ảnh?", "options": [{"id": "A", "text": "Nó giúp tạo ra thêm ảnh giả."}, {"id": "B", "text": "Nó cho phép tái sử dụng một mô hình đã được huấn luyện trên bộ dữ liệu lớn (như ImageNet) và tinh chỉnh lại cho bài toán cụ thể, giúp tiết kiệm thời gian và đạt hiệu suất cao."}, {"id": "C", "text": "Nó giúp chuyển dữ liệu từ máy tính này sang máy tính khác nhanh hơn."}, {"id": "D", "text": "Nó không có tác dụng gì."}], "answer": "B", "explanation": "Học chuyển giao là kỹ thuật phổ biến, tái sử dụng mô hình CNN đã huấn luyện trước, giúp đạt hiệu suất cao ngay cả với bộ dữ liệu nhỏ ."}, {"id": 104, "local_id": 25, "section": "PHẦN 3: ỨNG DỤNG & CASE STUDY (PHÁT HIỆN BỆNH TRÊN CÂY TRỒNG)", "difficulty": "Khó", "difficulty_code": "VD", "question": "Trong quy trình phát hiện bệnh cây trồng bằng AI, bước “Thu thập dữ liệu” (Data Acquisition) thường gặp thách thức lớn nhất là gì?", "options": [{"id": "A", "text": "Không có máy ảnh để chụp."}, {"id": "B", "text": "Thiếu dữ liệu hình ảnh chất lượng cao và được gán nhãn chính xác (đặc biệt là ảnh chụp thực tế ngoài đồng ruộng với nền phức tạp)."}, {"id": "C", "text": "Dữ liệu quá nhiều không thể lưu trữ hết."}, {"id": "D", "text": "Cây trồng không bao giờ bị bệnh."}], "answer": "B", "explanation": "Một trong những thách thức lớn là sự thiếu hụt các bộ dữ liệu công khai, chuẩn hóa và đại diện cho điều kiện thực tế (ánh sáng thay đổi, nền phức tạp) để huấn luyện mô hình."}, {"id": 105, "local_id": 26, "section": "PHẦN 3: ỨNG DỤNG & CASE STUDY (PHÁT HIỆN BỆNH TRÊN CÂY TRỒNG)", "difficulty": "Khó", "difficulty_code": "VD", "question": "Kỹ thuật “Tăng cường dữ liệu” (Data Augmentation) bao gồm những thao tác nào sau đây?", "options": [{"id": "A", "text": "Xoay ảnh, lật ảnh, cắt ảnh, thay đổi độ sáng để tạo ra các biến thể mới từ ảnh gốc."}, {"id": "B", "text": "Chụp thêm ảnh mới bằng máy ảnh khác."}, {"id": "C", "text": "Tăng độ phân giải của ảnh lên 4K."}, {"id": "D", "text": "Viết mô tả văn bản cho từng bức ảnh."}], "answer": "A", "explanation": "Tăng cường dữ liệu sử dụng các kỹ thuật như xoay, lật, thu phóng, cắt xén để tạo ra dữ liệu mới từ dữ liệu hiện có, giúp mô hình học tốt hơn và tránh overfitting."}, {"id": 106, "local_id": 27, "section": "PHẦN 3: ỨNG DỤNG & CASE STUDY (PHÁT HIỆN BỆNH TRÊN CÂY TRỒNG)", "difficulty": "Khó", "difficulty_code": "VD", "question": "Tại sao kỹ thuật Tăng cường dữ liệu lại quan trọng trong các dự án nông nghiệp?", "options": [{"id": "A", "text": "Vì nó giúp tiết kiệm dung lượng ổ cứng."}, {"id": "B", "text": "Vì việc thu thập hàng nghìn bức ảnh bệnh cây trong thực tế rất tốn kém và khó khăn; tăng cường giúp mở rộng bộ dữ liệu nhân tạo để mô hình học được nhiều biến thể hơn."}, {"id": "C", "text": "Vì nó làm cho bức ảnh đẹp hơn."}, {"id": "D", "text": "Vì nó giúp máy tính chạy mát hơn."}], "answer": "B", "explanation": "Kỹ thuật này giúp giải quyết vấn đề thiếu dữ liệu huấn luyện, làm cho mô hình mạnh mẽ hơn (robust) trước các thay đổi nhỏ của hình ảnh đầu vào."}, {"id": 107, "local_id": 28, "section": "PHẦN 3: ỨNG DỤNG & CASE STUDY (PHÁT HIỆN BỆNH TRÊN CÂY TRỒNG)", "difficulty": "Khó", "difficulty_code": "VD", "question": "Trong Case Study về bệnh lá táo (Chapter 8), ba loại bệnh chính được nghiên cứu là gì?", "options": [{"id": "A", "text": "Sốt xuất huyết, Cúm A, Covid-19."}, {"id": "B", "text": "Bệnh đốm lá Alternaria, Bệnh ghẻ táo (Apple Scab), và Bệnh thối táo (Apple Rot)."}, {"id": "C", "text": "Bệnh vàng lá, Bệnh rụng lá, Bệnh khô cành."}, {"id": "D", "text": "Bệnh phấn trắng, Bệnh sương mai, Bệnh gỉ sắt."}], "answer": "B", "explanation": "Nghiên cứu tập trung vào phân loại 4 nhãn: Khỏe mạnh, Bệnh đốm lá Alternaria, Bệnh ghẻ táo, và Bệnh thối táo ."}, {"id": 108, "local_id": 29, "section": "PHẦN 3: ỨNG DỤNG & CASE STUDY (PHÁT HIỆN BỆNH TRÊN CÂY TRỒNG)", "difficulty": "Khó", "difficulty_code": "VD", "question": "Trong nghiên cứu này, các tác giả đã so sánh hiệu suất của mô hình CNN tự xây dựng (Custom CNN) với các mô hình nào?", "options": [{"id": "A", "text": "Linear Regression, SVM, KNN."}, {"id": "B", "text": "VGG16, ResNet-50, InceptionV3."}, {"id": "C", "text": "RNN, LSTM, GRU."}, {"id": "D", "text": "Photoshop, Paint, Canva."}], "answer": "B", "explanation": "Nghiên cứu so sánh Custom CNN với các mô hình học sâu tiên tiến (SOTA) là VGG16, ResNet-50 và InceptionV3 ."}, {"id": 109, "local_id": 30, "section": "PHẦN 3: ỨNG DỤNG & CASE STUDY (PHÁT HIỆN BỆNH TRÊN CÂY TRỒNG)", "difficulty": "Khó", "difficulty_code": "VD", "question": "Kết quả thực nghiệm trong Chapter 8 cho thấy mô hình nào đạt hiệu suất cao nhất trong việc phân loại bệnh lá táo?", "options": [{"id": "A", "text": "Custom CNN (80%)."}, {"id": "B", "text": "ResNet-50 (81%)."}, {"id": "C", "text": "InceptionV3 (83%)."}, {"id": "D", "text": "VGG16 (85%)."}], "answer": "D", "explanation": "VGG16 đạt độ chính xác cao nhất là 85%, cùng với độ chuẩn xác, độ phủ và điểm F1 tốt nhất so với các mô hình khác."}, {"id": 110, "local_id": 31, "section": "PHẦN 3: ỨNG DỤNG & CASE STUDY (PHÁT HIỆN BỆNH TRÊN CÂY TRỒNG)", "difficulty": "Khó", "difficulty_code": "VD", "question": "Chỉ số “Precision” (Độ chuẩn xác) trong bài toán phát hiện bệnh có ý nghĩa gì?", "options": [{"id": "A", "text": "Tỷ lệ số lần mô hình dự đoán đúng trên tổng số ảnh."}, {"id": "B", "text": "Trong số các ảnh mô hình dự đoán là “Bệnh A”, có bao nhiêu phần trăm thực sự là “Bệnh A”."}, {"id": "C", "text": "Trong số tất cả các cây bị “Bệnh A” thực tế, mô hình tìm ra được bao nhiêu phần trăm."}, {"id": "D", "text": "Tốc độ dự đoán của mô hình."}], "answer": "B", "explanation": "Precision đo lường độ chính xác của các dự đoán tích cực. Nếu Precision thấp, nông dân sẽ tốn tiền phun thuốc cho cả những cây khỏe mạnh (dương tính giả)."}, {"id": 111, "local_id": 32, "section": "PHẦN 3: ỨNG DỤNG & CASE STUDY (PHÁT HIỆN BỆNH TRÊN CÂY TRỒNG)", "difficulty": "Khó", "difficulty_code": "VD", "question": "Chỉ số “Recall” (Độ phủ/Độ thu hồi) quan trọng như thế nào trong nông nghiệp?", "options": [{"id": "A", "text": "Nó cho biết mô hình bỏ sót bao nhiêu cây bị bệnh. Recall cao nghĩa là ít bỏ sót bệnh."}, {"id": "B", "text": "Nó cho biết mô hình chạy nhanh hay chậm."}, {"id": "C", "text": "Nó cho biết mô hình tốn bao nhiêu điện."}, {"id": "D", "text": "Nó không quan trọng bằng Accuracy."}], "answer": "A", "explanation": "Recall đo lường khả năng tìm ra tất cả các trường hợp bệnh thực tế. Trong dịch bệnh, Recall quan trọng vì bỏ sót một cây bệnh (âm tính giả) có thể lây lan cho cả vườn."}, {"id": 112, "local_id": 33, "section": "PHẦN 3: ỨNG DỤNG & CASE STUDY (PHÁT HIỆN BỆNH TRÊN CÂY TRỒNG)", "difficulty": "Khó", "difficulty_code": "VD", "question": "Bộ dữ liệu nổi tiếng nào thường được sử dụng làm chuẩn (benchmark) cho các nghiên cứu về bệnh cây trồng (được nhắc đến trong Chapter 10)?", "options": [{"id": "A", "text": "ImageNet."}, {"id": "B", "text": "Plant Village."}, {"id": "C", "text": "COCO Dataset."}, {"id": "D", "text": "MNIST."}], "answer": "B", "explanation": "Bộ dữ liệu Plant Village là kho lưu trữ phổ biến chứa hơn 50.000 hình ảnh lá cây khỏe mạnh và bị bệnh của nhiều loại cây trồng khác nhau ."}, {"id": 113, "local_id": 34, "section": "PHẦN 3: ỨNG DỤNG & CASE STUDY (PHÁT HIỆN BỆNH TRÊN CÂY TRỒNG)", "difficulty": "Khó", "difficulty_code": "VD", "question": "Trong dự án phát hiện bệnh khoai tây (Chapter 10), mô hình CNN được xây dựng đã đạt độ chính xác khoảng bao nhiêu?", "options": [{"id": "A", "text": "50%."}, {"id": "B", "text": "70%."}, {"id": "C", "text": "85%."}, {"id": "D", "text": "Trên 97% (cụ thể là 97.68% trên tập xác thực)."}], "answer": "D", "explanation": "Biểu đồ và kết quả cho t : "D", "text": "Hinge Loss."}], "answer": "B", "explanation": "Categorical Cross-Entropy là hàm mất mát tiêu chuẩn cho các bài toán phân loại đa lớp (ví dụ: Táo bị 1 trong 4 loại bệnh)."}, {"id": 117, "local_id": 38, "section": "PHẦN 3: ỨNG DỤNG & CASE STUDY (PHÁT HIỆN BỆNH TRÊN CÂY TRỒNG)", "difficulty": "Khó", "difficulty_code": "VD", "question": "Một mô hình bị “Overfitting” trong biểu đồ Accuracy/Loss sẽ có biểu hiện gì?", "options": [{"id": "A", "text": "Training Accuracy thấp, Validation Accuracy thấp."}, {"id": "B", "text": "Training Accuracy tăng cao (gần 100%), nhưng Validation Accuracy dậm chân tại chỗ hoặc giảm đi (khoảng cách giữa 2 đường lớn dần)."}, {"id": "C", "text": "Hai đường Training và Validation dính chặt vào nhau và cùng tăng."}, {"id": "D", "text": "Loss của tập Validation giảm xuống bằng 0."}], "answer": "B", "explanation": "Overfitting thể hiện khi mô hình học quá kỹ dữ liệu huấn luyện (Train Acc cao) nhưng không tổng quát được trên dữ liệu mới (Val Acc thấp/ngừng tăng)."}, {"id": 118, "local_id": 39, "section": "PHẦN 3: ỨNG DỤNG & CASE STUDY (PHÁT HIỆN BỆNH TRÊN CÂY TRỒNG)", "difficulty": "Khó", "difficulty_code": "VD", "question": "Lợi ích lớn nhất của việc tự động hóa phát hiện bệnh bằng AI so với phương pháp thủ công là gì?", "options": [{"id": "A", "text": "AI có thể phát hiện bệnh ở giai đoạn rất sớm (khi mắt thường khó thấy) và giám sát liên tục trên diện rộng (qua drone)."}, {"id": "B", "text": "AI không tốn tiền điện."}, {"id": "C", "text": "AI có thể chữa bệnh cho cây."}, {"id": "D", "text": "AI giúp cây lớn nhanh hơn."}], "answer": "A", "explanation": "Các phương pháp thủ công thường chậm, tốn công và mang tính chủ quan. AI cung cấp khả năng chẩn đoán nhanh, chính xác và có thể mở rộng trên diện tích lớn ."}];

    let currentIndex = 0;
    let selectedOption = null;
    let userAnswers = {}; // { index: { selected: 'A', isCorrect: true, checked: true } }
    let isChecked = false;

    // Elements
    const qCounter = document.getElementById('question-counter');
    const secTag = document.getElementById('section-tag');
    const diffTag = document.getElementById('difficulty-tag');
    const qText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const feedbackBox = document.getElementById('feedback-box');
    const feedbackTitle = document.getElementById('feedback-title');
    const feedbackDesc = document.getElementById('feedback-desc');
    const btnCheck = document.getElementById('btn-check');
    const btnNext = document.getElementById('btn-next');
    const btnPrev = document.getElementById('btn-prev');
    const progressFill = document.getElementById('progress-fill');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const paletteGrid = document.getElementById('palette-grid');

    function initQuiz() {
        buildPalette();
        renderQuestion(currentIndex);
    }

    function buildPalette() {
        paletteGrid.innerHTML = '';
        questions.forEach((q, idx) => {
            const item = document.createElement('div');
            item.className = 'palette-item';
            item.id = `palette-${idx}`;
            item.innerText = idx + 1;
            item.onclick = () => {
                toggleDrawer();
                jumpToQuestion(idx);
            };
            paletteGrid.appendChild(item);
        });
    }

    function updatePalette() {
        questions.forEach((q, idx) => {
            const el = document.getElementById(`palette-${idx}`);
            if (!el) return;
            el.className = 'palette-item';
            if (idx === currentIndex) el.classList.add('active');
            if (userAnswers[idx] && userAnswers[idx].checked) {
                if (userAnswers[idx].isCorrect) el.classList.add('correct');
                else el.classList.add('wrong');
            }
        });
    }

    function renderQuestion(index) {
        currentIndex = index;
        const q = questions[index];
        const state = userAnswers[index] || null;

        qCounter.innerText = `Câu hỏi ${index + 1} / ${questions.length}`;
        secTag.innerText = q.section || 'Nội dung trọng tâm';
        
        diffTag.innerText = q.difficulty || 'Trung bình';
        diffTag.className = 'tag-pill';
        if (q.difficulty === 'Dễ') diffTag.classList.add('diff-de');
        else if (q.difficulty === 'Khó') diffTag.classList.add('diff-kho');
        else diffTag.classList.add('diff-tb');

        qText.innerText = q.question;
        progressFill.style.width = `${((index + 1) / questions.length) * 100}%`;

        btnPrev.disabled = (index === 0);

        // Build Options
        optionsContainer.innerHTML = '';
        selectedOption = state ? state.selected : null;
        isChecked = state ? state.checked : false;

        q.options.forEach(opt => {
            const card = document.createElement('div');
            card.className = 'option-card';
            card.id = `opt-${opt.id}`;

            if (selectedOption === opt.id) {
                card.classList.add('selected');
            }

            if (isChecked) {
                card.classList.add('locked');
                if (opt.id === q.answer) {
                    card.classList.add('is-correct');
                } else if (opt.id === selectedOption && selectedOption !== q.answer) {
                    card.classList.add('is-wrong');
                }
            } else {
                card.onclick = () => selectOption(opt.id);
            }

            card.innerHTML = `
                <div class="option-letter">${opt.id}</div>
                <div class="option-text">${opt.text}</div>
            `;
            optionsContainer.appendChild(card);
        });

        // Feedback
        if (isChecked) {
            btnCheck.style.display = 'none';
            btnNext.style.display = 'inline-flex';
            btnNext.innerText = (index === questions.length - 1) ? 'Xem kết quả 🏁' : 'Câu tiếp theo →';
            showFeedback(state.isCorrect, q);
        } else {
            feedbackBox.className = 'feedback-box';
            btnCheck.style.display = 'inline-flex';
            btnCheck.disabled = !selectedOption;
            btnNext.style.display = 'none';
        }

        updatePalette();
    }

    function selectOption(optId) {
        if (isChecked) return;
        selectedOption = optId;
        document.querySelectorAll('.option-card').forEach(c => c.classList.remove('selected'));
        const target = document.getElementById(`opt-${optId}`);
        if (target) target.classList.add('selected');
        btnCheck.disabled = false;
    }

    function checkAnswer() {
        if (!selectedOption || isChecked) return;
        const q = questions[currentIndex];
        const isCorrect = (selectedOption === q.answer);

        isChecked = true;
        userAnswers[currentIndex] = {
            selected: selectedOption,
            isCorrect: isCorrect,
            checked: true
        };

        // Lock options & mark colors
        document.querySelectorAll('.option-card').forEach(c => c.classList.add('locked'));
        const correctCard = document.getElementById(`opt-${q.answer}`);
        if (correctCard) correctCard.classList.add('is-correct');

        if (!isCorrect) {
            const wrongCard = document.getElementById(`opt-${selectedOption}`);
            if (wrongCard) wrongCard.classList.add('is-wrong');
        }

        showFeedback(isCorrect, q);

        btnCheck.style.display = 'none';
        btnNext.style.display = 'inline-flex';
        btnNext.innerText = (currentIndex === questions.length - 1) ? 'Xem kết quả 🏁' : 'Câu tiếp theo →';

        updatePalette();
    }

    function showFeedback(isCorrect, q) {
        feedbackBox.className = `feedback-box show ${isCorrect ? 'correct' : 'incorrect'}`;
        if (isCorrect) {
            feedbackTitle.innerHTML = `<span>🎉</span> Chính xác!`;
        } else {
            feedbackTitle.innerHTML = `<span>❌</span> Chưa chính xác. Đáp án đúng là: <b>${q.answer}</b>`;
        }
        feedbackDesc.innerHTML = `<b>💡 Giải thích:</b> ${q.explanation || 'Không có giải thích bổ sung.'}`;
    }

    function navigateNext() {
        if (currentIndex < questions.length - 1) {
            renderQuestion(currentIndex + 1);
        } else {
            showResults();
        }
    }

    function navigatePrev() {
        if (currentIndex > 0) {
            renderQuestion(currentIndex - 1);
        }
    }

    function jumpToQuestion(idx) {
        renderQuestion(idx);
    }

    function showResults() {
        quizScreen.style.display = 'none';
        resultScreen.style.display = 'block';

        let correctCount = 0;
        let wrongCount = 0;
        questions.forEach((q, idx) => {
            if (userAnswers[idx] && userAnswers[idx].isCorrect) {
                correctCount++;
            } else {
                wrongCount++;
            }
        });

        const total = questions.length;
        const percent = Math.round((correctCount / total) * 100);

        document.getElementById('final-score').innerText = correctCount;
        document.getElementById('final-total').innerText = `/ ${total}`;
        document.getElementById('stat-correct').innerText = correctCount;
        document.getElementById('stat-wrong').innerText = wrongCount;
        document.getElementById('stat-accuracy').innerText = `${percent}%`;

        const scoreCircle = document.getElementById('score-circle');
        scoreCircle.style.background = `conic-gradient(var(--accent) ${percent}%, #e2e8f0 ${percent}%)`;

        const rTitle = document.getElementById('result-title');
        const rSummary = document.getElementById('result-summary');

        if (percent >= 90) {
            rTitle.innerText = "🌟 Xuất sắc! Nắm vững kiến thức";
            rSummary.innerText = "Bạn đã hoàn thành bài thi với kết quả tuyệt vời. Bạn đã hiểu rất sâu về nội dung của buổi học!";
        } else if (percent >= 75) {
            rTitle.innerText = "👏 Rất tốt! Đạt yêu cầu cao";
            rSummary.innerText = "Kết quả rất ấn tượng! Bạn đã nắm chắc hầu hết các khái niệm trọng tâm.";
        } else if (percent >= 50) {
            rTitle.innerText = "👍 Đạt yêu cầu cơ bản";
            rSummary.innerText = "Bạn đã vượt qua bài kiểm tra. Hãy xem lại các câu giải thích chi tiết để củng cố thêm phần còn yếu nhé!";
        } else {
            rTitle.innerText = "📖 Cần ôn tập thêm!";
            rSummary.innerText = "Bạn nên đọc lại slide bài giảng và tài liệu học tập rồi thử sức lại lần nữa nhé.";
        }
    }

    function restartQuiz() {
        userAnswers = {};
        currentIndex = 0;
        selectedOption = null;
        isChecked = false;
        resultScreen.style.display = 'none';
        quizScreen.style.display = 'block';
        initQuiz();
    }

    function viewAllAnswers() {
        resultScreen.style.display = 'none';
        quizScreen.style.display = 'block';
        renderQuestion(0);
    }

    function toggleDrawer() {
        const drawer = document.getElementById('drawer');
        const overlay = document.getElementById('drawer-overlay');
        const isOpen = drawer.classList.contains('open');
        if (isOpen) {
            drawer.classList.remove('open');
            overlay.style.display = 'none';
        } else {
            drawer.classList.add('open');
            overlay.style.display = 'block';
        }
    }

    // Khởi động
    initQuiz();
</script>
