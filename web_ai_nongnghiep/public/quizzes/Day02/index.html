<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc nghiệm Buổi 2: Học máy (Machine Learning) trong nông nghiệp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #15803d;
            --primary-hover: #166534;
            --primary-light: #dcfce7;
            --accent: #22c55e;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #16a34a;
            --success-bg: #f0fdf4;
            --success-border: #bbf7d0;
            --error: #dc2626;
            --error-bg: #fef2f2;
            --error-border: #fecaca;
            --radius: 12px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 24px 16px;
        }

        .quiz-wrapper {
            width: 100%;
            max-width: 840px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        /* Header Bar */
        .quiz-header {
            padding: 20px 28px;
            background: linear-gradient(135deg, #14532d 0%, #166534 100%);
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .quiz-header h1 {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .session-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            backdrop-filter: blur(4px);
        }

        .quiz-meta {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-palette {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-palette:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* Progress Bar */
        .progress-track {
            width: 100%;
            height: 6px;
            background-color: #e2e8f0;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #16a34a);
            width: 0%;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Quiz Body */
        .quiz-body {
            padding: 32px 28px;
        }

        .question-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .counter-badge {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary);
        }

        .tags-cluster {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .tag-pill {
            font-size: 0.78rem;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
            background: #f1f5f9;
            color: var(--text-muted);
        }

        .tag-pill.diff-de { background: #dcfce7; color: #166534; }
        .tag-pill.diff-tb { background: #fef3c7; color: #92400e; }
        .tag-pill.diff-kho { background: #fee2e2; color: #991b1b; }

        .question-title {
            font-size: 1.22rem;
            font-weight: 700;
            line-height: 1.55;
            color: var(--text-main);
            margin-bottom: 24px;
        }

        /* Options Grid */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-card {
            display: flex;
            align-items: flex-start;
            padding: 14px 18px;
            border: 2px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #ffffff;
            user-select: none;
        }

        .option-card:hover:not(.locked) {
            border-color: var(--accent);
            background: #f8fafc;
            transform: translateY(-1px);
        }

        .option-card.selected:not(.locked) {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .option-card.locked {
            cursor: default;
        }

        .option-card.is-correct {
            border-color: var(--success) !important;
            background-color: var(--success-bg) !important;
        }

        .option-card.is-wrong {
            border-color: var(--error) !important;
            background-color: var(--error-bg) !important;
        }

        .option-letter {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: #f1f5f9;
            color: var(--text-main);
            font-weight: 700;
            font-size: 0.95rem;
            margin-right: 14px;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .option-card.selected .option-letter {
            background: var(--primary);
            color: #ffffff;
        }

        .option-card.is-correct .option-letter {
            background: var(--success);
            color: #ffffff;
        }

        .option-card.is-wrong .option-letter {
            background: var(--error);
            color: #ffffff;
        }

        .option-text {
            font-size: 1.02rem;
            line-height: 1.5;
            color: var(--text-main);
            padding-top: 3px;
        }

        /* Feedback Box */
        .feedback-box {
            display: none;
            padding: 18px 20px;
            border-radius: 10px;
            margin-bottom: 24px;
            animation: slideDown 0.3s ease;
        }

        .feedback-box.show {
            display: block;
        }

        .feedback-box.correct {
            background-color: var(--success-bg);
            border: 1px solid var(--success-border);
        }

        .feedback-box.incorrect {
            background-color: var(--error-bg);
            border: 1px solid var(--error-border);
        }

        .feedback-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .correct .feedback-title { color: var(--success); }
        .incorrect .feedback-title { color: var(--error); }

        .feedback-desc {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #334155;
        }

        /* Action Buttons */
        .actions-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .btn {
            padding: 12px 26px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .btn-secondary {
            background: #f1f5f9;
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        /* Result Screen */
        .result-screen {
            display: none;
            text-align: center;
            padding: 40px 24px;
        }

        .score-ring-wrap {
            position: relative;
            width: 170px;
            height: 170px;
            margin: 0 auto 28px;
        }

        .score-circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(var(--accent) 0%, #e2e8f0 0%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }

        .score-inner {
            width: 136px;
            height: 136px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .score-number {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
        }

        .score-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 600;
        }

        .result-title {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        .result-summary {
            font-size: 1.05rem;
            color: var(--text-muted);
            max-width: 500px;
            margin: 0 auto 32px;
            line-height: 1.6;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            max-width: 500px;
            margin: 0 auto 36px;
        }

        .stat-card {
            padding: 16px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        .stat-val {
            font-size: 1.4rem;
            font-weight: 800;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 500;
        }

        /* Palette Drawer */
        .drawer-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 100;
        }

        .drawer {
            position: fixed;
            top: 0;
            right: -360px;
            width: 340px;
            height: 100%;
            background: #ffffff;
            box-shadow: -4px 0 20px rgba(0,0,0,0.15);
            z-index: 101;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            padding: 24px;
        }

        .drawer.open {
            right: 0;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .drawer-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            overflow-y: auto;
            flex: 1;
            padding-right: 4px;
        }

        .palette-item {
            height: 42px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        .palette-item:hover {
            border-color: var(--primary);
            background: #e2e8f0;
        }

        .palette-item.active {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary);
        }

        .palette-item.correct {
            background: var(--success);
            color: #ffffff;
            border-color: var(--success);
        }

        .palette-item.wrong {
            background: var(--error);
            color: #ffffff;
            border-color: var(--error);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 640px) {
            body { padding: 10px; }
            .quiz-body { padding: 20px 16px; }
            .quiz-header { padding: 16px; }
            .stats-grid { grid-template-columns: 1fr; gap: 8px; }
        }
    </style>
</head>
<body>

<div class="quiz-wrapper">
    <!-- Header -->
    <div class="quiz-header">
        <h1>
            <span>🌾</span>
            <span>Buổi 2: Học máy (Machine Learning) trong nông nghiệp</span>
        </h1>
        <div class="quiz-meta">
            <span class="session-badge">Buổi 2</span>
            <button class="btn-palette" onclick="toggleDrawer()">📋 Mục lục câu</button>
        </div>
    </div>

    <!-- Progress Track -->
    <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
    </div>

    <!-- Screen 1: Quiz Active -->
    <div class="quiz-body" id="quiz-screen">
        <div class="question-meta-row">
            <div class="counter-badge" id="question-counter">Câu hỏi 1 / 40</div>
            <div class="tags-cluster">
                <span class="tag-pill" id="section-tag">Tổng quan</span>
                <span class="tag-pill" id="difficulty-tag">Dễ</span>
            </div>
        </div>

        <h2 class="question-title" id="question-text">Đang tải câu hỏi...</h2>

        <div class="options-list" id="options-container">
            <!-- Dynamic Options -->
        </div>

        <!-- Feedback Container -->
        <div class="feedback-box" id="feedback-box">
            <div class="feedback-title" id="feedback-title"></div>
            <div class="feedback-desc" id="feedback-desc"></div>
        </div>

        <!-- Actions -->
        <div class="actions-row">
            <button class="btn btn-secondary" id="btn-prev" onclick="navigatePrev()">← Câu trước</button>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-primary" id="btn-check" onclick="checkAnswer()" disabled>Kiểm tra</button>
                <button class="btn btn-primary" id="btn-next" onclick="navigateNext()" style="display: none;">Câu tiếp theo →</button>
            </div>
        </div>
    </div>

    <!-- Screen 2: Results -->
    <div class="result-screen" id="result-screen">
        <div class="score-ring-wrap">
            <div class="score-circle" id="score-circle">
                <div class="score-inner">
                    <span class="score-number" id="final-score">0</span>
                    <span class="score-label" id="final-total">/ 40</span>
                </div>
            </div>
        </div>

        <h2 class="result-title" id="result-title">Chúc mừng bạn đã hoàn thành!</h2>
        <p class="result-summary" id="result-summary">Bạn đã trả lời xuất sắc hầu hết các câu hỏi trong phần này.</p>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-val" style="color: var(--success);" id="stat-correct">0</div>
                <div class="stat-label">Số câu đúng</div>
            </div>
            <div class="stat-card">
                <div class="stat-val" style="color: var(--error);" id="stat-wrong">0</div>
                <div class="stat-label">Số câu sai</div>
            </div>
            <div class="stat-card">
                <div class="stat-val" style="color: var(--primary);" id="stat-accuracy">0%</div>
                <div class="stat-label">Độ chính xác</div>
            </div>
        </div>

        <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
            <button class="btn btn-primary" onclick="restartQuiz()">🔄 Làm lại bài</button>
            <button class="btn btn-secondary" onclick="viewAllAnswers()">🔍 Xem lại chi tiết đáp án</button>
        </div>
    </div>
</div>

<!-- Drawer / Question Palette -->
<div class="drawer-overlay" id="drawer-overlay" onclick="toggleDrawer()"></div>
<div class="drawer" id="drawer">
    <div class="drawer-header">
        <h3 style="font-size: 1.1rem; font-weight: 700;">Danh sách câu hỏi</h3>
        <button class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.85rem;" onclick="toggleDrawer()">Đóng ✕</button>
    </div>
    <div class="drawer-grid" id="palette-grid">
        <!-- Palette numbers -->
    </div>
</div>

<script>
    const questions = [{"id": 41, "local_id": 1, "section": "PHẦN 1: TỔNG QUAN VÀ PHÂN LOẠI HỌC MÁY", "difficulty": "Dễ", "difficulty_code": "NB", "question": "Định nghĩa kinh điển về Học máy (Machine Learning) của Arthur Samuel (1959) là gì?", "options": [{"id": "A", "text": "Là lĩnh vực nghiên cứu tạo ra các robot giống người."}, {"id": "B", "text": "Là lĩnh vực nghiên cứu cung cấp cho máy tính khả năng học hỏi mà không cần được lập trình rõ ràng (explicitly programmed)."}, {"id": "C", "text": "Là việc viết các quy tắc if-else phức tạp để xử lý dữ liệu."}, {"id": "D", "text": "Là quá trình thay thế hoàn toàn bộ não con người bằng chip điện tử."}], "answer": "B", "explanation": "Arthur Samuel định nghĩa ML là “lĩnh vực nghiên cứu cung cấp cho máy tính khả năng học hỏi mà không cần được lập trình rõ ràng”."}, {"id": 42, "local_id": 2, "section": "PHẦN 1: TỔNG QUAN VÀ PHÂN LOẠI HỌC MÁY", "difficulty": "Dễ", "difficulty_code": "NB", "question": "Sự khác biệt cơ bản nhất giữa “Lập trình truyền thống” và “Học máy” là gì?", "options": [{"id": "A", "text": "Lập trình truyền thống dùng Python, Học máy dùng C++."}, {"id": "B", "text": "Lập trình truyền thống: Con người nhập quy tắc Máy ra đáp án. Học máy: Con người nhập dữ liệu + đáp án Máy tự tìm ra quy tắc."}, {"id": "C", "text": "Lập trình truyền thống nhanh hơn Học máy."}, {"id": "D", "text": "Học máy không cần máy tính để chạy."}], "answer": "B", "explanation": "Trong lập trình truyền thống, người lập trình viết ra các quy tắc tường minh. Trong học máy, hệ thống tự động học các quy tắc hoặc mẫu từ dữ liệu."}, {"id": 43, "local_id": 3, "section": "PHẦN 1: TỔNG QUAN VÀ PHÂN LOẠI HỌC MÁY", "difficulty": "Dễ", "difficulty_code": "NB", "question": "Trong “Học có giám sát” (Supervised Learning), dữ liệu huấn luyện có đặc điểm gì quan trọng nhất?", "options": [{"id": "A", "text": "Dữ liệu rất lớn và không có cấu trúc."}, {"id": "B", "text": "Dữ liệu bao gồm các đầu vào (input) và các nhãn (labels) mong muốn."}, {"id": "C", "text": "Dữ liệu chỉ toàn là hình ảnh."}, {"id": "D", "text": "Dữ liệu không có bất kỳ nhãn nào."}], "answer": "B", "explanation": "Trong học có giám sát, dữ liệu huấn luyện được cung cấp cho thuật toán bao gồm các giải pháp mong muốn, được gọi là nhãn (labels)."}, {"id": 44, "local_id": 4, "section": "PHẦN 1: TỔNG QUAN VÀ PHÂN LOẠI HỌC MÁY", "difficulty": "Dễ", "difficulty_code": "NB", "question": "Bài toán dự đoán “Giá nhà” hoặc “Nhiệt độ ngày mai” (giá trị liên tục) thuộc loại nào trong Học có giám sát?", "options": [{"id": "A", "text": "Phân loại (Classification)."}, {"id": "B", "text": "Phân cụm (Clustering)."}, {"id": "C", "text": "Hồi quy (Regression)."}, {"id": "D", "text": "Giảm chiều dữ liệu."}], "answer": "C", "explanation": "Hồi quy (Regression) là bài toán dự đoán một giá trị đầu ra liên tục, ví dụ như dự đoán giá nhà, nhiệt độ, năng suất cây trồng."}, {"id": 45, "local_id": 5, "section": "PHẦN 1: TỔNG QUAN VÀ PHÂN LOẠI HỌC MÁY", "difficulty": "Dễ", "difficulty_code": "NB", "question": "Bài toán lọc thư rác (Spam/Non-spam) là ví dụ điển hình của loại vấn đề nào?", "options": [{"id": "A", "text": "Hồi quy (Regression)."}, {"id": "B", "text": "Phân loại (Classification)."}, {"id": "C", "text": "Phân cụm (Clustering)."}, {"id": "D", "text": "Học tăng cường (Reinforcement Learning)."}], "answer": "B", "explanation": "Phân loại (Classification) là dự đoán một đầu ra thuộc một danh mục rời rạc, ví dụ “thư rác” hoặc “không phải thư rác”."}, {"id": 46, "local_id": 6, "section": "PHẦN 1: TỔNG QUAN VÀ PHÂN LOẠI HỌC MÁY", "difficulty": "Dễ", "difficulty_code": "NB", "question": "Đặc điểm chính của “Học không giám sát” (Unsupervised Learning) là gì?", "options": [{"id": "A", "text": "Hệ thống học từ dữ liệu đã được gán nhãn bởi con người."}, {"id": "B", "text": "Hệ thống phải tự tìm ra các mẫu (patterns) hoặc cấu trúc ẩn trong dữ liệu không có nhãn."}, {"id": "C", "text": "Hệ thống học thông qua việc nhận thưởng và phạt."}, {"id": "D", "text": "Hệ thống chỉ học khi có người giám sát bên cạnh."}], "answer": "B", "explanation": "Trong học không giám sát, dữ liệu huấn luyện không có nhãn. Hệ thống phải cố gắng học và tìm ra các cấu trúc hoặc mẫu tiềm ẩn trong dữ liệu ."}, {"id": 47, "local_id": 7, "section": "PHẦN 1: TỔNG QUAN VÀ PHÂN LOẠI HỌC MÁY", "difficulty": "Dễ", "difficulty_code": "NB", "question": "Thuật toán nào sau đây thuộc nhóm “Học không giám sát”?", "options": [{"id": "A", "text": "Hồi quy tuyến tính (Linear Regression)."}, {"id": "B", "text": "Cây quyết định (Decision Tree)."}, {"id": "C", "text": "Phân cụm K-Means (K-Means Clustering)."}, {"id": "D", "text": "Máy Vector Hỗ trợ (SVM)."}], "answer": "C", "explanation": "K-Means là thuật toán phổ biến dùng cho bài toán Phân cụm (Clustering) trong học không giám sát."}, {"id": 48, "local_id": 8, "section": "PHẦN 1: TỔNG QUAN VÀ PHÂN LOẠI HỌC MÁY", "difficulty": "Dễ", "difficulty_code": "NB", "question": "“Học tăng cường” (Reinforcement Learning) hoạt động dựa trên cơ chế nào?", "options": [{"id": "A", "text": "Học thuộc lòng dữ liệu lịch sử."}, {"id": "B", "text": "Thử và sai (Trial and error) để tối đa hóa phần thưởng (reward) hoặc giảm thiểu hình phạt."}, {"id": "C", "text": "Phân tích thống kê mô tả."}, {"id": "D", "text": "Gán nhãn thủ công cho dữ liệu."}], "answer": "B", "explanation": "Tác nhân (agent) học bằng cách tương tác với môi trường, thực hiện hành động và nhận lại phần thưởng hoặc hình phạt, thông qua quá trình thử và sai ."}, {"id": 49, "local_id": 9, "section": "PHẦN 1: TỔNG QUAN VÀ PHÂN LOẠI HỌC MÁY", "difficulty": "Dễ", "difficulty_code": "NB", "question": "Sự khác biệt giữa “Học theo lô” (Batch Learning) và “Học trực tuyến” (Online Learning) là gì?", "options": [{"id": "A", "text": "Học theo lô huấn luyện trên toàn bộ dữ liệu một lúc; Học trực tuyến huấn luyện dần dần theo từng phần nhỏ."}, {"id": "B", "text": "Học theo lô nhanh hơn Học trực tuyến."}, {"id": "C", "text": "Học trực tuyến không cần dữ liệu mới."}, {"id": "D", "text": "Học theo lô dùng cho dự báo thời tiết, Học trực tuyến dùng cho giá nhà."}], "answer": "A", "explanation": "Học theo lô sử dụng tất cả dữ liệu có sẵn cùng lúc (ngoại tuyến). Học trực tuyến huấn luyện tăng dần bằng cách cung cấp dữ liệu theo từng phần nhỏ (mini-batches) ."}, {"id": 50, "local_id": 10, "section": "PHẦN 1: TỔNG QUAN VÀ PHÂN LOẠI HỌC MÁY", "difficulty": "Dễ", "difficulty_code": "NB", "question": "Hiện tượng “Quá khớp” (Overfitting) xảy ra khi nào?", "options": [{"id": "A", "text": "Mô hình quá đơn giản để nắm bắt quy luật của dữ liệu."}, {"id": "B", "text": "Mô hình hoạt động rất tốt trên dữ liệu huấn luyện nhưng kém trên dữ liệu mới (học vẹt)."}, {"id": "C", "text": "Mô hình hoạt động kém trên cả dữ liệu huấn luyện và dữ liệu mới."}, {"id": "D", "text": "Dữ liệu huấn luyện quá ít."}], "answer": "B", "explanation": "Overfitting xảy ra khi mô hình hoạt động tốt trên dữ liệu huấn luyện nhưng không tổng quát hóa tốt cho dữ liệu mới, thường do mô hình quá phức tạp so với lượng dữ liệu."}, {"id": 51, "local_id": 11, "section": "PHẦN 1: TỔNG QUAN VÀ PHÂN LOẠI HỌC MÁY", "difficulty": "Dễ", "difficulty_code": "NB", "question": "Hiện tượng “Chưa khớp” (Underfitting) là gì?", "options": [{"id": "A", "text": "Mô hình quá phức tạp, học cả nhiễu của dữ liệu."}, {"id": "B", "text": "Mô hình quá đơn giản để nắm bắt cấu trúc cơ bản của dữ liệu, hoạt động kém trên cả tập huấn luyện."}, {"id": "C", "text": "Mô hình dự đoán chính xác 100%."}, {"id": "D", "text": "Mô hình chạy quá chậm."}], "answer": "B", "explanation": "Underfitting xảy ra khi mô hình quá đơn giản để nắm bắt cấu trúc cơ bản của dữ liệu. Nó hoạt động kém trên cả dữ liệu huấn luyện và dữ liệu mới."}, {"id": 52, "local_id": 12, "section": "PHẦN 1: TỔNG QUAN VÀ PHÂN LOẠI HỌC MÁY", "difficulty": "Dễ", "difficulty_code": "NB", "question": "Đâu là một thách thức về chất lượng dữ liệu thường gặp trong dự án ML (“Dữ liệu kém”)?", "options": [{"id": "A", "text": "Dữ liệu chứa nhiều nhiễu, giá trị ngoại lai (outliers) hoặc bị thiếu."}, {"id": "B", "text": "Dữ liệu được sắp xếp quá ngăn nắp."}, {"id": "C", "text": "Dữ liệu có quá nhiều nhãn chính xác."}, {"id": "D", "text": "Dữ liệu được thu thập từ một nguồn duy nhất."}], "answer": "A", "explanation": "Dữ liệu chất lượng kém (chứa lỗi, giá trị ngoại lai hoặc nhiễu) sẽ làm cho việc phát hiện các mẫu cơ bản trở nên khó khăn, dẫn đến hiệu suất hệ thống kém."}, {"id": 53, "local_id": 13, "section": "PHẦN 2: CÁC THUẬT TOÁN HỌC MÁY PHỔ BIẾN", "difficulty": "Trung bình", "difficulty_code": "TH", "question": "Thuật toán “Hồi quy tuyến tính” (Linear Regression) thường được sử dụng cho mục đích gì?", "options": [{"id": "A", "text": "Phân loại hình ảnh mèo và chó."}, {"id": "B", "text": "Tìm mối quan hệ tuyến tính giữa biến phụ thuộc và biến độc lập để dự đoán một giá trị liên tục (ví dụ: sản lượng lúa)."}, {"id": "C", "text": "Gom nhóm khách hàng theo sở thích."}, {"id": "D", "text": "Tạo ra văn bản tự động."}], "answer": "B", "explanation": "Hồi quy tuyến tính mô hình hóa mối quan hệ tuyến tính giữa một biến phụ thuộc và một hoặc nhiều biến độc lập, tìm đường thẳng phù hợp nhất với dữ liệu ."}, {"id": 54, "local_id": 14, "section": "PHẦN 2: CÁC THUẬT TOÁN HỌC MÁY PHỔ BIẾN", "difficulty": "Trung bình", "difficulty_code": "TH", "question": "Thuật toán “Hồi quy Logistic” (Logistic Regression) khác Hồi quy tuyến tính ở điểm nào cơ bản nhất?", "options": [{"id": "A", "text": "Hồi quy Logistic dùng để dự báo thời tiết dài hạn."}, {"id": "B", "text": "Hồi quy Logistic dùng cho bài toán Phân loại (đầu ra là xác suất thuộc về một lớp, ví dụ: 0 hoặc 1), thay vì dự đoán giá trị liên tục."}, {"id": "C", "text": "Hồi quy Logistic không cần dữ liệu đầu vào."}, {"id": "D", "text": "Hồi quy Logistic chạy chậm hơn rất nhiều."}], "answer": "B", "explanation": "Hồi quy Logistic ước tính xác suất một đầu vào thuộc về một lớp cụ thể (Phân loại), sử dụng hàm sigmoid để đưa đầu ra về khoảng [0, 1] ."}, {"id": 55, "local_id": 15, "section": "PHẦN 2: CÁC THUẬT TOÁN HỌC MÁY PHỔ BIẾN", "difficulty": "Trung bình", "difficulty_code": "TH", "question": "Cấu trúc của thuật toán “Cây quyết định” (Decision Tree) bao gồm các thành phần nào?", "options": [{"id": "A", "text": "Các nơ-ron và khớp nối thần kinh."}, {"id": "B", "text": "Nút gốc, nút nội bộ (kiểm tra thuộc tính), nhánh (kết quả kiểm tra) và nút lá (nhãn lớp)."}, {"id": "C", "text": "Các vòng lặp vô tận."}, {"id": "D", "text": "Các siêu phẳng đa chiều."}], "answer": "B", "explanation": "Mỗi nút bên trong đại diện cho một “bài kiểm tra” trên một thuộc tính, mỗi nhánh là kết quả của bài kiểm tra và mỗi nút lá là một nhãn lớp ."}, {"id": 56, "local_id": 16, "section": "PHẦN 2: CÁC THUẬT TOÁN HỌC MÁY PHỔ BIẾN", "difficulty": "Trung bình", "difficulty_code": "TH", "question": "Tại sao thuật toán “Rừng ngẫu nhiên” (Random Forest) thường được ưa chuộng hơn một “Cây quyết định” đơn lẻ?", "options": [{"id": "A", "text": "Vì nó đơn giản hơn."}, {"id": "B", "text": "Vì nó giúp giảm hiện tượng “Quá khớp” (Overfitting) và thường cho độ chính xác cao hơn bằng cách kết hợp kết quả của nhiều cây."}, {"id": "C", "text": "Vì nó tốn ít tài nguyên máy tính hơn."}, {"id": "D", "text": "Vì nó có thể vẽ được biểu đồ đẹp hơn."}], "answer": "B", "explanation": "Random Forest là phương pháp học ensemble, xây dựng nhiều cây quyết định; nó ít bị quá khớp hơn cây quyết định đơn lẻ và độ chính xác cao ."}, {"id": 57, "local_id": 17, "section": "PHẦN 2: CÁC THUẬT TOÁN HỌC MÁY PHỔ BIẾN", "difficulty": "Trung bình", "difficulty_code": "TH", "question": "Mục tiêu chính của thuật toán “Máy Vector Hỗ trợ” (SVM) trong bài toán phân loại là gì?", "options": [{"id": "A", "text": "Tìm tất cả các điểm dữ liệu giống nhau."}, {"id": "B", "text": "Tìm một siêu phẳng (hyperplane) tối ưu để phân tách các lớp dữ liệu với lề (margin) lớn nhất."}, {"id": "C", "text": "Tính toán xác suất xuất hiện của từng từ."}, {"id": "D", "text": "Sắp xếp dữ liệu theo thứ tự tăng dần."}], "answer": "B", "explanation": "SVM tìm một siêu phẳng trong không gian n-chiều để phân loại các điểm dữ liệu. Mục tiêu là tối đa hóa lề (margin) giữa các lớp ."}, {"id": 58, "local_id": 18, "section": "PHẦN 2: CÁC THUẬT TOÁN HỌC MÁY PHỔ BIẾN", "difficulty": "Trung bình", "difficulty_code": "TH", "question": "Thuật toán “Naïve Bayes” dựa trên định lý toán học nào và có giả định “ngây thơ” gì?", "options": [{"id": "A", "text": "Định lý Pytago; giả định các cạnh tam giác vuông góc."}, {"id": "B", "text": "Định lý Bayes; giả định sự độc lập có điều kiện giữa các đặc trưng (các tính chất không ảnh hưởng lẫn nhau)."}, {"id": "C", "text": "Định lý Thales; giả định các đường thẳng song song."}, {"id": "D", "text": "Định lý Newton; giả định lực hấp dẫn."}], "answer": "B", "explanation": "Naïve Bayes dựa trên định lý Bayes với giả định “ngây thơ” về sự độc lập có điều kiện giữa các đặc trưng ."}, {"id": 59, "local_id": 19, "section": "PHẦN 2: CÁC THUẬT TOÁN HỌC MÁY PHỔ BIẾN", "difficulty": "Trung bình", "difficulty_code": "TH", "question": "Thuật toán “K-Láng giềng gần nhất” (KNN) phân loại một điểm dữ liệu mới dựa trên nguyên tắc nào?", "options": [{"id": "A", "text": "Bỏ phiếu theo đa số của K điểm dữ liệu gần nó nhất trong không gian."}, {"id": "B", "text": "Dựa trên công thức hồi quy phức tạp."}, {"id": "C", "text": "Dựa trên việc tung đồng xu."}, {"id": "D", "text": "Dựa trên giá trị trung bình của toàn bộ tập dữ liệu."}], "answer": "A", "explanation": "KNN phân loại một điểm dữ liệu mới bằng cách bỏ phiếu theo đa số của K láng giềng gần nhất của nó ."}, {"id": 60, "local_id": 20, "section": "PHẦN 2: CÁC THUẬT TOÁN HỌC MÁY PHỔ BIẾN", "difficulty": "Trung bình", "difficulty_code": "TH", "question": "Nhược điểm lớn nhất của thuật toán KNN khi làm việc với tập dữ liệu lớn là gì?", "options": [{"id": "A", "text": "Độ chính xác quá thấp."}, {"id": "B", "text": "Tốn kém về mặt tính toán và yêu cầu bộ nhớ cao (do phải lưu và tính khoảng cách với tất cả điểm dữ liệu)."}, {"id": "C", "text": "Khó cài đặt."}, {"id": "D", "text": "Chỉ hoạt động với dữ liệu văn bản."}], "answer": "B", "explanation": "KNN tốn kém về mặt tính toán, yêu cầu bộ nhớ cao, và nhạy cảm với quy mô dữ liệu."}, {"id": 61, "local_id": 21, "section": "PHẦN 2: CÁC THUẬT TOÁN HỌC MÁY PHỔ BIẾN", "difficulty": "Trung bình", "difficulty_code": "TH", "question": "Thuật toán “K-Means” thuộc loại học máy nào và nhiệm vụ chính là gì?", "options": [{"id": "A", "text": "Học có giám sát; Phân loại ảnh."}, {"id": "B", "text": "Học không giám sát; Phân cụm dữ liệu (gom các điểm dữ liệu tương tự vào K nhóm)."}, {"id": "C", "text": "Học tăng cường; Chơi game."}, {"id": "D", "text": "Học bán giám sát; Dịch ngôn ngữ."}], "answer": "B", "explanation": "K-Means là thuật toán học không giám sát dùng để phân chia n quan sát vào k cụm ."}, {"id": 62, "local_id": 22, "section": "PHẦN 2: CÁC THUẬT TOÁN HỌC MÁY PHỔ BIẾN", "difficulty": "Trung bình", "difficulty_code": "TH", "question": "Trong thuật toán K-Means, người dùng phải xác định trước tham số nào?", "options": [{"id": "A", "text": "Số lượng lớp (labels)."}, {"id": "B", "text": "Số lượng cụm (k) cần phân chia."}, {"id": "C", "text": "Tốc độ học (learning rate)."}, {"id": "D", "text": "Độ sâu của cây."}], "answer": "B", "explanation": "Nhược điểm của K-Means là phải chọn trước số cụm (k)."}, {"id": 63, "local_id": 23, "section": "PHẦN 2: CÁC THUẬT TOÁN HỌC MÁY PHỔ BIẾN", "difficulty": "Trung bình", "difficulty_code": "TH", "question": "Hàm kích hoạt nào thường được sử dụng ở đầu ra của mô hình Hồi quy Logistic để ép giá trị về khoảng [0,1]?", "options": [{"id": "A", "text": "ReLU."}, {"id": "B", "text": "Sigmoid."}, {"id": "C", "text": "Tanh."}, {"id": "D", "text": "Linear."}], "answer": "B", "explanation": "Hồi quy Logistic sử dụng hàm sigmoid để đưa đầu ra về khoảng [0, 1]."}, {"id": 64, "local_id": 24, "section": "PHẦN 2: CÁC THUẬT TOÁN HỌC MÁY PHỔ BIẾN", "difficulty": "Trung bình", "difficulty_code": "TH", "question": "Để giải quyết vấn đề “Quá khớp” (Overfitting) trong Cây quyết định (Decision Tree), phương pháp nào thường được sử dụng?", "options": [{"id": "A", "text": "Tăng độ sâu của cây lên vô hạn."}, {"id": "B", "text": "Cắt tỉa cây (Pruning) hoặc sử dụng Rừng ngẫu nhiên (Random Forest)."}, {"id": "C", "text": "Xóa bớt dữ liệu huấn luyện."}, {"id": "D", "text": "Không làm gì cả."}], "answer": "B", "explanation": "Cây quyết định dễ bị quá khớp. Rừng ngẫu nhiên (kết hợp nhiều cây) ít bị quá khớp hơn cây quyết định đơn lẻ."}, {"id": 65, "local_id": 25, "section": "PHẦN 3: ỨNG DỤNG THỰC TẾ (PHÂN LOẠI ĐẤT & DỰ BÁO THỜI TIẾT)", "difficulty": "Khó", "difficulty_code": "VD", "question": "Mục tiêu chính của hệ thống “Khuyến nghị cây trồng” (Crop Recommender) dựa trên ML là gì?", "options": [{"id": "A", "text": "Dự đoán giá thị trường của nông sản vào năm sau."}, {"id": "B", "text": "Đề xuất loại cây trồng phù hợp nhất để canh tác dựa trên các thông số đất đai và môi trường cụ thể."}, {"id": "C", "text": "Tự động gieo hạt giống xuống đất."}, {"id": "D", "text": "Phân loại các loại côn trùng có hại."}], "answer": "B", "explanation": "Hệ thống nhằm mục đích giải quyết vấn đề nông dân chọn sai cây trồng gây năng suất thấp bằng cách đề xuất loại cây phù hợp nhất với điều kiện đất ."}, {"id": 66, "local_id": 26, "section": "PHẦN 3: ỨNG DỤNG THỰC TẾ (PHÂN LOẠI ĐẤT & DỰ BÁO THỜI TIẾT)", "difficulty": "Khó", "difficulty_code": "VD", "question": "Trong bài toán Khuyến nghị cây trồng (Chapter 5), đâu là các đặc trưng đầu vào (Input features) quan trọng nhất của đất?", "options": [{"id": "A", "text": "Màu sắc đất và mùi vị."}, {"id": "B", "text": "Hàm lượng Nitơ (N), Phốt pho (P), Kali (K) và độ pH."}, {"id": "C", "text": "Số lượng giun đất."}, {"id": "D", "text": "Độ sâu của lớp đất mặt."}], "answer": "B", "explanation": "Dữ liệu đầu vào bao gồm các đặc điểm của đất như hàm lượng N, P, K và độ pH ."}, {"id": 67, "local_id": 27, "section": "PHẦN 3: ỨNG DỤNG THỰC TẾ (PHÂN LOẠI ĐẤT & DỰ BÁO THỜI TIẾT)", "difficulty": "Khó", "difficulty_code": "VD", "question": "Ngoài các yếu tố về đất, hệ thống khuyến nghị cây trồng còn cần dữ liệu môi trường nào để tăng độ chính xác?", "options": [{"id": "A", "text": "Tốc độ gió và hướng gió."}, {"id": "B", "text": "Nhiệt độ, độ ẩm và lượng mưa."}, {"id": "C", "text": "Mực nước biển."}, {"id": "D", "text": "Áp suất không khí."}], "answer": "B", "explanation": "Hệ thống cũng xem xét các yếu tố môi trường như nhiệt độ, độ ẩm và lượng mưa."}, {"id": 68, "local_id": 28, "section": "PHẦN 3: ỨNG DỤNG THỰC TẾ (PHÂN LOẠI ĐẤT & DỰ BÁO THỜI TIẾT)", "difficulty": "Khó", "difficulty_code": "VD", "question": "Trong các thử nghiệm nghiên cứu (Chapter 5), nhóm thuật toán nào thường cho độ chính xác cao nhất (lên tới 99%) cho bài toán khuyến nghị cây trồng?", "options": [{"id": "A", "text": "Hồi quy tuyến tính đơn giản."}, {"id": "B", "text": "Naïve Bayes."}, {"id": "C", "text": "Các kỹ thuật Ensemble (như Random Forest, Bagging)."}, {"id": "D", "text": "K-Means Clustering."}], "answer": "C", "explanation": "Tài liệu nêu rõ: “Các mô hình ensemble đã chứng tỏ hiệu quả vượt trội, đạt độ chính xác lên tới 99%” ."}, {"id": 69, "local_id": 29, "section": "PHẦN 3: ỨNG DỤNG THỰC TẾ (PHÂN LOẠI ĐẤT & DỰ BÁO THỜI TIẾT)", "difficulty": "Khó", "difficulty_code": "VD", "question": "Trong quy trình xây dựng mô hình ML cho nông nghiệp, bước “Tiền xử lý” (Preprocessing) như “Feature Scaling” (Co giãn đặc trưng) có tác dụng gì?", "options": [{"id": "A", "text": "Làm tăng số lượng dữ liệu lên gấp đôi."}, {"id": "B", "text": "Đưa các biến số (ví dụ: lượng mưa mm và nhiệt độ độ C) về cùng một thang đo để thuật toán không bị thiên lệch."}, {"id": "C", "text": "Xóa bỏ các dữ liệu quan trọng."}, {"id": "D", "text": "Làm giảm độ chính xác của mô hình."}], "answer": "B", "explanation": "Feature Scaling giúp đưa các đặc trưng về một phạm vi chung, tránh việc một đặc trưng có giá trị lớn lấn át các đặc trưng khác."}, {"id": 70, "local_id": 30, "section": "PHẦN 3: ỨNG DỤNG THỰC TẾ (PHÂN LOẠI ĐẤT & DỰ BÁO THỜI TIẾT)", "difficulty": "Khó", "difficulty_code": "VD", "question": "Bài toán “Dự báo thời tiết ngắn hạn” (Chapter 14) sử dụng loại dữ liệu đặc thù nào?", "options": [{"id": "A", "text": "Dữ liệu hình ảnh tĩnh."}, {"id": "B", "text": "Dữ liệu văn bản."}, {"id": "C", "text": "Dữ liệu chuỗi thời gian (Time-series data)."}, {"id": "D", "text": "Dữ liệu âm thanh."}], "answer": "C", "explanation": "Dự báo thời tiết sử dụng “Dữ liệu chuỗi thời gian hàng ngày” về nhiệt độ, lượng mưa, v.v.."}, {"id": 71, "local_id": 31, "section": "PHẦN 3: ỨNG DỤNG THỰC TẾ (PHÂN LOẠI ĐẤT & DỰ BÁO THỜI TIẾT)", "difficulty": "Khó", "difficulty_code": "VD", "question": "Tại sao các Mạng Nơ-ron Hồi quy (RNN) lại phù hợp cho bài toán dự báo thời tiết hơn là các mạng nơ-ron truyền thống?", "options": [{"id": "A", "text": "Vì nó xử lý được hình ảnh tốt hơn."}, {"id": "B", "text": "Vì nó có khả năng ghi nhớ thông tin từ các bước thời gian trước đó (xử lý dữ liệu chuỗi)."}, {"id": "C", "text": "Vì nó chạy nhanh hơn trên CPU."}, {"id": "D", "text": "Vì nó không cần dữ liệu huấn luyện."}], "answer": "B", "explanation": "RNN được thiết kế đặc biệt cho dữ liệu chuỗi thời gian vì chúng có các kết nối hồi quy cho phép duy trì “bộ nhớ”."}, {"id": 72, "local_id": 32, "section": "PHẦN 3: ỨNG DỤNG THỰC TẾ (PHÂN LOẠI ĐẤT & DỰ BÁO THỜI TIẾT)", "difficulty": "Khó", "difficulty_code": "VD", "question": "Trong nghiên cứu về dự báo thời tiết (Chapter 14), cấu hình mô hình nào cho kết quả tốt hơn khi dự báo nhiều biến thời tiết?", "options": [{"id": "A", "text": "MIMO (Nhiều đầu vào - Nhiều đầu ra)."}, {"id": "B", "text": "SISO (Đầu vào Đơn - Đầu ra Đơn) - Xây dựng mô hình riêng cho từng biến."}, {"id": "C", "text": "Không dùng mô hình nào cả."}, {"id": "D", "text": "Chỉ dùng Random Forest."}], "answer": "B", "explanation": "Tài liệu kết luận rằng “cấu hình SISO (mỗi mô hình dự báo một biến) cho kết quả tốt hơn, cho thấy các biến thời tiết có thể được mô hình hóa hiệu quả một cách độc lập” ."}, {"id": 73, "local_id": 33, "section": "PHẦN 3: ỨNG DỤNG THỰC TẾ (PHÂN LOẠI ĐẤT & DỰ BÁO THỜI TIẾT)", "difficulty": "Khó", "difficulty_code": "VD", "question": "Để đánh giá sai số của mô hình dự báo thời tiết (giá trị liên tục như nhiệt độ), chỉ số nào thường được sử dụng?", "options": [{"id": "A", "text": "Accuracy (Độ chính xác phân loại)."}, {"id": "B", "text": "Precision & Recall."}, {"id": "C", "text": "RMSE (Căn bậc hai của Sai số bình phương trung bình) hoặc MSE."}, {"id": "D", "text": "F1-Score."}], "answer": "C", "explanation": "Đối với các bài toán hồi quy/dự báo giá trị liên tục như nhiệt độ, các chỉ số đo lường sai số như MSE, RMSE được sử dụng."}, {"id": 74, "local_id": 34, "section": "PHẦN 3: ỨNG DỤNG THỰC TẾ (PHÂN LOẠI ĐẤT & DỰ BÁO THỜI TIẾT)", "difficulty": "Khó", "difficulty_code": "VD", "question": "Kỹ thuật “Làm mịn dữ liệu” (Data Smoothing) như EMA (Exponential Moving Average) trong dự báo thời tiết có tác dụng gì?", "options": [{"id": "A", "text": "Loại bỏ nhiễu (noise) để làm lộ rõ xu hướng của dữ liệu thời tiết."}, {"id": "B", "text": "Làm cho dữ liệu trở nên phức tạp hơn."}, {"id": "C", "text": "Tăng kích thước tệp dữ liệu."}, {"id": "D", "text": "Mã hóa dữ liệu để bảo mật."}], "answer": "A", "explanation": "Tiền xử lý bao gồm “làm mịn dữ liệu (EMA)” để xử lý nhiễu."}, {"id": 75, "local_id": 35, "section": "PHẦN 3: ỨNG DỤNG THỰC TẾ (PHÂN LOẠI ĐẤT & DỰ BÁO THỜI TIẾT)", "difficulty": "Khó", "difficulty_code": "VD", "question": "Trong bài toán “Phân loại độ phì nhiêu của đất” (Soil Fertility Analysis), nếu sử dụng thuật toán “Phân cụm” (Clustering) thay vì Phân loại, điều đó có nghĩa là gì?", "options": [{"id": "A", "text": "Chúng ta đã biết trước nhãn đất (Tốt/Xấu)."}, {"id": "B", "text": "Chúng ta chưa biết nhãn, muốn máy tự động gom nhóm các mẫu đất có đặc tính giống nhau."}, {"id": "C", "text": "Chúng ta muốn dự đoán giá đất."}, {"id": "D", "text": "Chúng ta muốn vẽ bản đồ đất."}], "answer": "B", "explanation": "Phân cụm là học không giám sát, dùng để nhóm các điểm dữ liệu tương tự (các mẫu đất) khi t đặc trưng."}], "answer": "B", "explanation": "Bước “Giám sát và Cập nhật liên tục” với dữ liệu mới giúp mô hình thích ứng với các thay đổi của môi trường theo thời gian ."}, {"id": 79, "local_id": 39, "section": "PHẦN 3: ỨNG DỤNG THỰC TẾ (PHÂN LOẠI ĐẤT & DỰ BÁO THỜI TIẾT)", "difficulty": "Khó", "difficulty_code": "VD", "question": "Đâu là một ví dụ về “Kỹ thuật đặc trưng” (Feature Engineering) trong bài toán dự báo năng suất cây trồng?", "options": [{"id": "A", "text": "Xóa bỏ cột “Lượng mưa”."}, {"id": "B", "text": "Tạo thêm một cột mới là “Tỷ lệ N/P” từ hai cột “Nitơ” và “Phốt pho” có sẵn."}, {"id": "C", "text": "Đổi tên cột “Nhiệt độ” thành “Temp”."}, {"id": "D", "text": "Sao chép dữ liệu ra 2 bản."}], "answer": "B", "explanation": "Kỹ thuật đặc trưng là tạo ra các biến mới (như tỷ lệ dinh dưỡng) từ dữ liệu hiện có để nâng cao hiệu suất mô hình."}];

    let currentIndex = 0;
    let selectedOption = null;
    let userAnswers = {}; // { index: { selected: 'A', isCorrect: true, checked: true } }
    let isChecked = false;

    // Elements
    const qCounter = document.getElementById('question-counter');
    const secTag = document.getElementById('section-tag');
    const diffTag = document.getElementById('difficulty-tag');
    const qText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const feedbackBox = document.getElementById('feedback-box');
    const feedbackTitle = document.getElementById('feedback-title');
    const feedbackDesc = document.getElementById('feedback-desc');
    const btnCheck = document.getElementById('btn-check');
    const btnNext = document.getElementById('btn-next');
    const btnPrev = document.getElementById('btn-prev');
    const progressFill = document.getElementById('progress-fill');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const paletteGrid = document.getElementById('palette-grid');

    function initQuiz() {
        buildPalette();
        renderQuestion(currentIndex);
    }

    function buildPalette() {
        paletteGrid.innerHTML = '';
        questions.forEach((q, idx) => {
            const item = document.createElement('div');
            item.className = 'palette-item';
            item.id = `palette-${idx}`;
            item.innerText = idx + 1;
            item.onclick = () => {
                toggleDrawer();
                jumpToQuestion(idx);
            };
            paletteGrid.appendChild(item);
        });
    }

    function updatePalette() {
        questions.forEach((q, idx) => {
            const el = document.getElementById(`palette-${idx}`);
            if (!el) return;
            el.className = 'palette-item';
            if (idx === currentIndex) el.classList.add('active');
            if (userAnswers[idx] && userAnswers[idx].checked) {
                if (userAnswers[idx].isCorrect) el.classList.add('correct');
                else el.classList.add('wrong');
            }
        });
    }

    function renderQuestion(index) {
        currentIndex = index;
        const q = questions[index];
        const state = userAnswers[index] || null;

        qCounter.innerText = `Câu hỏi ${index + 1} / ${questions.length}`;
        secTag.innerText = q.section || 'Nội dung trọng tâm';
        
        diffTag.innerText = q.difficulty || 'Trung bình';
        diffTag.className = 'tag-pill';
        if (q.difficulty === 'Dễ') diffTag.classList.add('diff-de');
        else if (q.difficulty === 'Khó') diffTag.classList.add('diff-kho');
        else diffTag.classList.add('diff-tb');

        qText.innerText = q.question;
        progressFill.style.width = `${((index + 1) / questions.length) * 100}%`;

        btnPrev.disabled = (index === 0);

        // Build Options
        optionsContainer.innerHTML = '';
        selectedOption = state ? state.selected : null;
        isChecked = state ? state.checked : false;

        q.options.forEach(opt => {
            const card = document.createElement('div');
            card.className = 'option-card';
            card.id = `opt-${opt.id}`;

            if (selectedOption === opt.id) {
                card.classList.add('selected');
            }

            if (isChecked) {
                card.classList.add('locked');
                if (opt.id === q.answer) {
                    card.classList.add('is-correct');
                } else if (opt.id === selectedOption && selectedOption !== q.answer) {
                    card.classList.add('is-wrong');
                }
            } else {
                card.onclick = () => selectOption(opt.id);
            }

            card.innerHTML = `
                <div class="option-letter">${opt.id}</div>
                <div class="option-text">${opt.text}</div>
            `;
            optionsContainer.appendChild(card);
        });

        // Feedback
        if (isChecked) {
            btnCheck.style.display = 'none';
            btnNext.style.display = 'inline-flex';
            btnNext.innerText = (index === questions.length - 1) ? 'Xem kết quả 🏁' : 'Câu tiếp theo →';
            showFeedback(state.isCorrect, q);
        } else {
            feedbackBox.className = 'feedback-box';
            btnCheck.style.display = 'inline-flex';
            btnCheck.disabled = !selectedOption;
            btnNext.style.display = 'none';
        }

        updatePalette();
    }

    function selectOption(optId) {
        if (isChecked) return;
        selectedOption = optId;
        document.querySelectorAll('.option-card').forEach(c => c.classList.remove('selected'));
        const target = document.getElementById(`opt-${optId}`);
        if (target) target.classList.add('selected');
        btnCheck.disabled = false;
    }

    function checkAnswer() {
        if (!selectedOption || isChecked) return;
        const q = questions[currentIndex];
        const isCorrect = (selectedOption === q.answer);

        isChecked = true;
        userAnswers[currentIndex] = {
            selected: selectedOption,
            isCorrect: isCorrect,
            checked: true
        };

        // Lock options & mark colors
        document.querySelectorAll('.option-card').forEach(c => c.classList.add('locked'));
        const correctCard = document.getElementById(`opt-${q.answer}`);
        if (correctCard) correctCard.classList.add('is-correct');

        if (!isCorrect) {
            const wrongCard = document.getElementById(`opt-${selectedOption}`);
            if (wrongCard) wrongCard.classList.add('is-wrong');
        }

        showFeedback(isCorrect, q);

        btnCheck.style.display = 'none';
        btnNext.style.display = 'inline-flex';
        btnNext.innerText = (currentIndex === questions.length - 1) ? 'Xem kết quả 🏁' : 'Câu tiếp theo →';

        updatePalette();
    }

    function showFeedback(isCorrect, q) {
        feedbackBox.className = `feedback-box show ${isCorrect ? 'correct' : 'incorrect'}`;
        if (isCorrect) {
            feedbackTitle.innerHTML = `<span>🎉</span> Chính xác!`;
        } else {
            feedbackTitle.innerHTML = `<span>❌</span> Chưa chính xác. Đáp án đúng là: <b>${q.answer}</b>`;
        }
        feedbackDesc.innerHTML = `<b>💡 Giải thích:</b> ${q.explanation || 'Không có giải thích bổ sung.'}`;
    }

    function navigateNext() {
        if (currentIndex < questions.length - 1) {
            renderQuestion(currentIndex + 1);
        } else {
            showResults();
        }
    }

    function navigatePrev() {
        if (currentIndex > 0) {
            renderQuestion(currentIndex - 1);
        }
    }

    function jumpToQuestion(idx) {
        renderQuestion(idx);
    }

    function showResults() {
        quizScreen.style.display = 'none';
        resultScreen.style.display = 'block';

        let correctCount = 0;
        let wrongCount = 0;
        questions.forEach((q, idx) => {
            if (userAnswers[idx] && userAnswers[idx].isCorrect) {
                correctCount++;
            } else {
                wrongCount++;
            }
        });

        const total = questions.length;
        const percent = Math.round((correctCount / total) * 100);

        document.getElementById('final-score').innerText = correctCount;
        document.getElementById('final-total').innerText = `/ ${total}`;
        document.getElementById('stat-correct').innerText = correctCount;
        document.getElementById('stat-wrong').innerText = wrongCount;
        document.getElementById('stat-accuracy').innerText = `${percent}%`;

        const scoreCircle = document.getElementById('score-circle');
        scoreCircle.style.background = `conic-gradient(var(--accent) ${percent}%, #e2e8f0 ${percent}%)`;

        const rTitle = document.getElementById('result-title');
        const rSummary = document.getElementById('result-summary');

        if (percent >= 90) {
            rTitle.innerText = "🌟 Xuất sắc! Nắm vững kiến thức";
            rSummary.innerText = "Bạn đã hoàn thành bài thi với kết quả tuyệt vời. Bạn đã hiểu rất sâu về nội dung của buổi học!";
        } else if (percent >= 75) {
            rTitle.innerText = "👏 Rất tốt! Đạt yêu cầu cao";
            rSummary.innerText = "Kết quả rất ấn tượng! Bạn đã nắm chắc hầu hết các khái niệm trọng tâm.";
        } else if (percent >= 50) {
            rTitle.innerText = "👍 Đạt yêu cầu cơ bản";
            rSummary.innerText = "Bạn đã vượt qua bài kiểm tra. Hãy xem lại các câu giải thích chi tiết để củng cố thêm phần còn yếu nhé!";
        } else {
            rTitle.innerText = "📖 Cần ôn tập thêm!";
            rSummary.innerText = "Bạn nên đọc lại slide bài giảng và tài liệu học tập rồi thử sức lại lần nữa nhé.";
        }
    }

    function restartQuiz() {
        userAnswers = {};
        currentIndex = 0;
        selectedOption = null;
        isChecked = false;
        resultScreen.style.display = 'none';
        quizScreen.style.display = 'block';
        initQuiz();
    }

    function viewAllAnswers() {
        resultScreen.style.display = 'none';
        quizScreen.style.display = 'block';
        renderQuestion(0);
    }

    function toggleDrawer() {
        const drawer = document.getElementById('drawer');
        const overlay = document.getElementById('drawer-overlay');
        const isOpen = drawer.classList.contains('open');
        if (isOpen) {
            drawer.classList.remove('open');
            overlay.style.display = 'none';
        } else {
            drawer.classList.add('open');
            overlay.style.display = 'block';
        }
    }

    // Khởi động
    initQuiz();
</script>

</body>
</html>
